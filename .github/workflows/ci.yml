name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: mojibake guard
        run: node scripts/check-mojibake.mjs App.tsx src
      - name: typecheck
        run: npx tsc --noEmit
